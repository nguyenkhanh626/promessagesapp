server:
  port: 8080

spring:
  application:
    name: chatapp

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://localhost:5432/chatapp_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# App Custom Configs
app:
  jwt:
    # 256-bit base64 secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
  upload:
    dir: uploads
  webrtc:
    stun-urls:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"
      - "stun:localhost:3478"
    turn-url: ${TURN_URL:turn:localhost:3478}
    turn-username: ${TURN_USERNAME:promessages}
    turn-credential: ${TURN_CREDENTIAL:promessages123}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com/v1beta
